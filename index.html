<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мое Telegram Приложение</title>
  <!-- Подключаем официальный скрипт Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .user-card {
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      padding: 15px 25px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      width: 80%;
    }
    button {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="user-card">
    <h2>Привет, <span id="username">Пользователь</span>! 👋</h2>
    <p>Это твое первое Mini App приложение.</p>
  </div>

  <button onclick="tg.close()">Закрыть приложение</button>

  <script>
    // Инициализация Telegram Mini App
    const tg = window.Telegram.WebApp;
    
    // Автоматически подстраивает тему под темную/светлую тему пользователя
    tg.ready();
    
    // Раскрывает приложение на весь экран
    tg.expand();

    // Получаем имя пользователя из Telegram
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
    }
  </script>
</body>
</html>
