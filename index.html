<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Web Messenger</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- PeerJS for Real-Time Direct Messaging (P2P Data Channel) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --panel-bg: rgba(30, 41, 59, 0.85);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --msg-out: #4f46e5;
            --msg-in: rgba(51, 65, 85, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 14px 16px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 12px;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(74, 222, 128, 0.2);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
        }

        /* Container & Pages */
        .main-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .page {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 14px;
        }

        .page.active {
            display: flex;
        }

        /* Chat Cards */
        .chat-card {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-card:active {
            transform: scale(0.98);
            background: rgba(51, 65, 85, 0.8);
        }

        .avatar-box {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            margin-right: 12px;
            overflow: hidden;
            flex-shrink: 0;
            color: #fff;
        }

        .avatar-box.favorites {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .chat-details {
            flex: 1;
            min-width: 0;
        }

        .chat-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .chat-preview {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chat View Window */
        .chat-view {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-gradient);
            z-index: 30;
            display: none;
            flex-direction: column;
        }

        .chat-view.active {
            display: flex;
        }

        .messages-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .msg-bubble.out {
            align-self: flex-end;
            background: var(--msg-out);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .msg-bubble.in {
            align-self: flex-start;
            background: var(--msg-in);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        .msg-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin-top: 6px;
            display: block;
            object-fit: cover;
        }

        .msg-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-bar {
            padding: 10px 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-input-bar input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid var(--panel-border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            outline: none;
            font-size: 14px;
        }

        .attach-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--panel-border);
            color: #818cf8;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .attach-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .send-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0 18px;
            height: 42px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .send-btn:active {
            background: var(--accent-hover);
        }

        /* Image Preview Badge */
        .image-preview-badge {
            display: none;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid var(--panel-border);
            align-items: center;
            justify-content: space-between;
        }

        .image-preview-badge.active {
            display: flex;
        }

        .preview-img-thumb {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* Profile Card */
        .profile-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 22px 16px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .username-copy-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            margin-top: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .username-copy-row:active {
            transform: scale(0.95);
            background: rgba(99, 102, 241, 0.3);
        }

        .copy-icon {
            width: 14px;
            height: 14px;
            fill: #818cf8;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            transition: background 0.2s;
        }

        .btn-primary:active {
            background: var(--accent-hover);
        }

        /* Bottom Nav (Cleaned - 3 tabs only) */
        .bottom-nav {
            display: flex;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--panel-border);
            z-index: 10;
        }

        .nav-btn {
            flex: 1;
            padding: 12px 0;
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-btn.active {
            color: #818cf8;
        }

        .nav-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Toast Notifications */
        .toast-notification {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
            z-index: 100;
            pointer-events: none;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1 id="header-title">Чаты</h1>
        <div class="status-badge" id="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">Онлайн</span>
        </div>
    </header>

    <!-- Content pages -->
    <div class="main-container">
        
        <!-- Tab 1: Chats (Includes Pinned "Избранное") -->
        <div id="page-chats" class="page active">
            <!-- Pinned Favorites Chat -->
            <div class="chat-card" onclick="openChat('favorites')">
                <div class="avatar-box favorites">🔖</div>
                <div class="chat-details">
                    <div class="chat-header-row">
                        <span class="chat-name">Избранное</span>
                        <span class="chat-time" id="fav-last-time"></span>
                    </div>
                    <div class="chat-preview" id="fav-last-msg">Ваше личное облако заметок</div>
                </div>
            </div>

            <!-- List of All Dynamic Conversations -->
            <div id="chats-list">
                <p style="text-align: center; color: var(--text-muted); margin-top: 30px; font-size: 14px;">Загрузка диалогов...</p>
            </div>
        </div>

        <!-- Tab 2: Search Friend -->
        <div id="page-search" class="page">
            <div class="form-group">
                <input type="text" id="search-input" class="form-control" placeholder="Введи ID или username друга..." oninput="searchUsers()">
            </div>
            <div id="search-results">
                <p style="text-align: center; color: var(--text-muted); margin-top: 20px; font-size: 13px;">Введи никнейм или ID пользователя, чтобы открылась возможность переписки</p>
            </div>
        </div>

        <!-- Tab 3: Profile -->
        <div id="page-profile" class="page">
            <div class="profile-card">
                <div class="avatar-box" id="profile-avatar-preview" style="width: 76px; height: 76px; font-size: 36px; margin: 0 auto 12px auto;">😎</div>
                <h2 id="profile-display-name" style="font-size: 20px;">Загрузка...</h2>
                
                <!-- Copy Username Button -->
                <div>
                    <div class="username-copy-row" onclick="copyUsername()">
                        <span id="profile-username" style="color: #818cf8; font-size: 14px; font-weight: 600;">@username</span>
                        <svg class="copy-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    </div>
                </div>

                <!-- Strict User ID Display -->
                <p id="profile-id-tag" style="color: var(--text-muted); font-size: 13px; margin-top: 12px; font-weight: 500;">Мой ID: ...</p>
            </div>

            <div class="form-group">
                <label>Отображаемое имя</label>
                <input type="text" id="edit-name" class="form-control" placeholder="Твоё имя">
            </div>

            <div class="form-group">
                <label>Аватарка (Emoji или ссылка на фото)</label>
                <input type="text" id="edit-avatar" class="form-control" placeholder="Например: 🚀 или https://...">
            </div>

            <button class="btn-primary" onclick="saveProfile()">Сохранить изменения</button>
        </div>
    </div>

    <!-- Active Chat Window -->
    <div class="chat-view" id="chat-view">
        <header>
            <button onclick="closeChat()" style="background:none; border:none; color: #818cf8; font-size:15px; font-weight:600; cursor:pointer;">← Назад</button>
            <h1 id="active-chat-name" style="font-size: 16px;">Чат</h1>
            <div style="width: 45px;"></div>
        </header>

        <div class="messages-area" id="messages-container"></div>

        <!-- Image Attachment Preview Bar -->
        <div class="image-preview-badge" id="image-preview-bar">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img id="preview-img-thumb" class="preview-img-thumb" src="" alt="preview">
                <span style="font-size: 12px; color: var(--text-muted);">Фото прикреплено</span>
            </div>
            <button onclick="clearAttachedImage()" style="background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer; font-weight:bold;">✕</button>
        </div>

        <div class="chat-input-bar">
            <button class="attach-btn" onclick="document.getElementById('photo-input').click()" title="Прикрепить фото">
                📷
            </button>
            <input type="file" id="photo-input" accept="image/*" style="display: none;" onchange="handlePhotoSelect(event)">

            <input type="text" id="message-input" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button class="send-btn" onclick="sendChatMessage()">Отправить</button>
        </div>
    </div>

    <!-- Bottom Nav Bar (3 Tabs Only: Чаты, Найти, Профиль) -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchPage('chats', this)">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            Чаты
        </button>
        <button class="nav-btn" onclick="switchPage('search', this)">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            Найти
        </button>
        <button class="nav-btn" onclick="switchPage('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Профиль
        </button>
    </nav>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast-notification">Уведомление</div>

    <script>
        // Telegram WebApp Setup
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Generate or load user data
        function initUserData() {
            const tgUser = tg?.initDataUnsafe?.user;
            let saved = JSON.parse(localStorage.getItem('app_user_profile_v3'));

            if (tgUser && tgUser.id) {
                return {
                    id: String(tgUser.id),
                    name: tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : ''),
                    username: tgUser.username || 'user_' + tgUser.id,
                    avatar: saved?.avatar || '😎'
                };
            }

            if (!saved) {
                const randId = Math.floor(100000 + Math.random() * 900000);
                saved = {
                    id: String(randId),
                    name: 'Пользователь',
                    username: 'user_' + randId,
                    avatar: '🚀'
                };
            }
            return saved;
        }

        let currentUser = initUserData();
        let activeChatTarget = null;
        let attachedImageData = null;
        let activeConnections = {}; // PeerJS connection pool
        let peer = null;

        let localMessagesDB = JSON.parse(localStorage.getItem('app_messages_db_v3')) || {};

        window.onload = function() {
            saveUserData();
            updateProfileUI();
            renderChatsList();
            updateFavoritesPreview();
            setupPeerNetwork();
        };

        function saveUserData() {
            localStorage.setItem('app_user_profile_v3', JSON.stringify(currentUser));
        }

        // Initialize PeerJS for direct Real-Time WebRTC packet transfer
        function setupPeerNetwork() {
            // Using ID prefix to avoid PeerJS ID collisions
            const peerId = 'tgapp_user_' + currentUser.id;
            peer = new Peer(peerId);

            peer.on('open', function(id) {
                console.log('Подключено к сети сообщений. Твой P2P ID:', id);
            });

            // Listen for incoming message packets from friends
            peer.on('connection', function(conn) {
                conn.on('data', function(packet) {
                    handleIncomingPacket(packet);
                });
            });

            peer.on('error', function(err) {
                console.log('Сеть:', err.type);
            });
        }

        function connectToPeer(targetId) {
            const remotePeerId = 'tgapp_user_' + targetId;
            if (activeConnections[remotePeerId]) return activeConnections[remotePeerId];

            const conn = peer.connect(remotePeerId);
            conn.on('open', function() {
                activeConnections[remotePeerId] = conn;
            });
            conn.on('data', function(packet) {
                handleIncomingPacket(packet);
            });
            return conn;
        }

        function handleIncomingPacket(packet) {
            if (!packet || !packet.senderId) return;

            const targetKey = packet.senderId;
            if (!localMessagesDB[targetKey]) {
                localMessagesDB[targetKey] = [];
            }

            localMessagesDB[targetKey].push(packet.msgObj);
            localStorage.setItem('app_messages_db_v3', JSON.stringify(localMessagesDB));

            if (activeChatTarget === targetKey) {
                renderMessages();
            } else {
                showToast('Новое сообщение от ' + targetKey);
            }

            renderChatsList();
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function copyUsername() {
            const fullUsername = '@' + currentUser.username;
            const tempInput = document.createElement('input');
            tempInput.value = fullUsername;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            showToast('Юзернейм ' + fullUsername + ' скопирован!');
        }

        function updateProfileUI() {
            document.getElementById('profile-display-name').innerText = currentUser.name;
            document.getElementById('profile-username').innerText = '@' + currentUser.username;
            document.getElementById('profile-id-tag').innerText = 'Мой ID: ' + currentUser.id;
            
            document.getElementById('edit-name').value = currentUser.name;
            document.getElementById('edit-avatar').value = currentUser.avatar;

            const box = document.getElementById('profile-avatar-preview');
            if (currentUser.avatar.startsWith('http')) {
                box.innerHTML = `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
            } else {
                box.innerText = currentUser.avatar || '👤';
            }
        }

        function saveProfile() {
            currentUser.name = document.getElementById('edit-name').value.trim() || currentUser.name;
            currentUser.avatar = document.getElementById('edit-avatar').value.trim() || '🚀';
            saveUserData();
            updateProfileUI();
            showToast('Профиль сохранён');
        }

        function switchPage(page, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById('page-' + page).classList.add('active');
            btn.classList.add('active');

            const headers = { 
                chats: 'Чаты', 
                search: 'Поиск контактов', 
                profile: 'Мой профиль' 
            };
            document.getElementById('header-title').innerText = headers[page];
        }

        function updateFavoritesPreview() {
            const favs = localMessagesDB['favorites'] || [];
            if (favs.length > 0) {
                const last = favs[favs.length - 1];
                document.getElementById('fav-last-msg').innerText = last.image ? '📷 Фотография' : last.text;
                document.getElementById('fav-last-time').innerText = last.time;
            }
        }

        function renderChatsList() {
            const list = document.getElementById('chats-list');
            const chats = Object.keys(localMessagesDB).filter(k => k !== 'favorites');

            if (chats.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); margin-top: 30px; font-size: 13px;">
                        <p>Нет активных диалогов</p>
                        <p style="margin-top: 6px;">Откройте вкладку <b>«Найти»</b>, чтобы написать другу.</p>
                    </div>`;
                return;
            }

            list.innerHTML = '';
            chats.forEach(target => {
                const history = localMessagesDB[target];
                const last = history[history.length - 1];

                const card = document.createElement('div');
                card.className = 'chat-card';
                card.onclick = () => openChat(target);

                const displayPreview = last ? (last.image ? '📷 [Фотография] ' + (last.text || '') : last.text) : 'Нет сообщений';

                card.innerHTML = `
                    <div class="avatar-box">💬</div>
                    <div class="chat-details">
                        <div class="chat-header-row">
                            <span class="chat-name">${target}</span>
                            <span class="chat-time">${last ? last.time : ''}</span>
                        </div>
                        <div class="chat-preview">${escapeHtml(displayPreview)}</div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function searchUsers() {
            const val = document.getElementById('search-input').value.trim();
            const res = document.getElementById('search-results');

            if (!val) {
                res.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 20px; font-size: 13px;">Введи никнейм или ID пользователя, чтобы открылась возможность переписки</p>';
                return;
            }

            res.innerHTML = `
                <div class="chat-card" onclick="openChat('${val}')">
                    <div class="avatar-box">👤</div>
                    <div class="chat-details">
                        <div class="chat-name">Диалог с "${val}"</div>
                        <div class="chat-preview">Нажми, чтобы начать переписку</div>
                    </div>
                </div>
            `;
        }

        function openChat(target) {
            activeChatTarget = target;
            const title = target === 'favorites' ? '🔖 Избранное' : target;
            document.getElementById('active-chat-name').innerText = title;
            document.getElementById('chat-view').classList.add('active');
            
            // Connect to user peer if not favorite
            if (target !== 'favorites') {
                connectToPeer(target);
            }
            
            renderMessages();
        }

        function closeChat() {
            document.getElementById('chat-view').classList.remove('active');
            activeChatTarget = null;
            clearAttachedImage();
            renderChatsList();
            updateFavoritesPreview();
        }

        /* Image Attachment Handling */
        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Compress / convert image to base64
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800; // Resize max dimension to keep packets small

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    attachedImageData = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('preview-img-thumb').src = attachedImageData;
                    document.getElementById('image-preview-bar').classList.add('active');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearAttachedImage() {
            attachedImageData = null;
            document.getElementById('photo-input').value = '';
            document.getElementById('image-preview-bar').classList.remove('active');
        }

        function renderMessages() {
            const box = document.getElementById('messages-container');
            box.innerHTML = '';

            const list = localMessagesDB[activeChatTarget] || [];
            list.forEach(m => {
                const el = document.createElement('div');
                el.className = 'msg-bubble ' + (m.sender === currentUser.id ? 'out' : 'in');
                
                let imgHTML = m.image ? `<img src="${m.image}" class="msg-img" onclick="window.open('${m.image}')">` : '';
                let textHTML = m.text ? `<div>${escapeHtml(m.text)}</div>` : '';

                el.innerHTML = `
                    ${imgHTML}
                    ${textHTML}
                    <div class="msg-time">${m.time}</div>
                `;
                box.appendChild(el);
            });

            box.scrollTop = box.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('message-input');
            const txt = input.value.trim();

            if ((!txt && !attachedImageData) || !activeChatTarget) return;

            if (!localMessagesDB[activeChatTarget]) {
                localMessagesDB[activeChatTarget] = [];
            }

            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            const msgObj = {
                sender: currentUser.id,
                text: txt,
                image: attachedImageData,
                time: time
            };

            // Save locally
            localMessagesDB[activeChatTarget].push(msgObj);
            localStorage.setItem('app_messages_db_v3', JSON.stringify(localMessagesDB));

            // Direct P2P packet transmission if not in favorites
            if (activeChatTarget !== 'favorites') {
                const packet = {
                    senderId: currentUser.id,
                    msgObj: msgObj
                };

                const remotePeerId = 'tgapp_user_' + activeChatTarget;
                const conn = activeConnections[remotePeerId] || connectToPeer(activeChatTarget);

                if (conn && conn.open) {
                    conn.send(packet);
                } else {
                    // Re-attempt sending on open connection
                    const newConn = peer.connect(remotePeerId);
                    newConn.on('open', function() {
                        activeConnections[remotePeerId] = newConn;
                        newConn.send(packet);
                    });
                }
            }

            input.value = '';
            clearAttachedImage();
            renderMessages();
            updateFavoritesPreview();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;")
                       .replace(/"/g, "&quot;")
                       .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
