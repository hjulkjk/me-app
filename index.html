<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мое Telegram Приложение</title>
  <!-- Подключаем официальный скрипт Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #7f91a4);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #242f3d);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Шапка */
    header {
      padding: 12px 16px;
      background-color: var(--secondary-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    /* Поиск */
    .search-bar {
      padding: 8px 16px;
      background-color: var(--bg-color);
    }

    .search-bar input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 10px;
      border: none;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      outline: none;
      font-size: 14px;
    }

    /* Основной контент */
    .content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Список чатов */
    .chat-list {
      display: flex;
      flex-direction: column;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .chat-item:active {
      background-color: var(--secondary-bg);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--button-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      margin-right: 12px;
      color: #fff;
    }

    .chat-info {
      flex: 1;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .chat-time {
      font-size: 12px;
      color: var(--hint-color);
      font-weight: normal;
    }

    .chat-last-msg {
      font-size: 14px;
      color: var(--hint-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* Окно диалога */
    .chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-color);
      z-index: 10;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.in {
      background-color: var(--secondary-bg);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.out {
      background-color: var(--button-color);
      color: var(--button-text-color);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      padding: 10px 12px;
      background-color: var(--secondary-bg);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: none;
      outline: none;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 14px;
    }

    .input-area button {
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    /* Нижняя панель */
    .bottom-nav {
      display: flex;
      background-color: var(--secondary-bg);
      border-top: 1px solid rgba(0, 0, 0, 0.15);
    }

    .nav-btn {
      flex: 1;
      padding: 8px 0;
      background: none;
      border: none;
      color: var(--hint-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--button-color);
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .tab-page {
      display: none;
      padding: 20px;
      text-align: center;
    }

    .tab-page.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Верхняя шапка -->
  <header id="header">
    <h1 id="page-title">Чаты</h1>
  </header>

  <!-- Поиск -->
  <div class="search-bar" id="search-bar">
    <input type="text" placeholder="Поиск по чатам...">
  </div>

  <!-- Контент -->
  <div class="content">
    <!-- Вкладка Чаты -->
    <div id="tab-chats" class="chat-list">
      <div class="chat-item" onclick="openChat('Павел Дуров', 'П')">
        <div class="avatar">П</div>
        <div class="chat-info">
          <div class="chat-title">Павел Дуров <span class="chat-time">12:30</span></div>
          <div class="chat-last-msg">Привет! Добро пожаловать в мессенджер.</div>
        </div>
      </div>
      <div class="chat-item" onclick="openChat('Разработка', 'Р')">
        <div class="avatar" style="background-color: #e53935;">Р</div>
        <div class="chat-info">
          <div class="chat-title">Разработка <span class="chat-time">10:15</span></div>
          <div class="chat-last-msg">Интерфейс и кнопки успешно обновлены.</div>
        </div>
      </div>
    </div>

    <!-- Вкладка Контакты -->
    <div id="tab-contacts" class="tab-page">
      <h3>Контакты</h3>
      <p style="color: var(--hint-color); margin-top: 10px;">Список ваших контактов.</p>
    </div>

    <!-- Вкладка Профиль -->
    <div id="tab-profile" class="tab-page">
      <h2>Привет, <span id="username">Пользователь</span>! 👋</h2>
      <p style="margin-top: 10px; color: var(--hint-color);">Это твой личный профиль.</p>
      <button onclick="tg.close()" style="margin-top: 20px; padding: 10px 20px; border-radius: 10px; background: var(--button-color); color: #fff; border: none; cursor: pointer;">
        Закрыть приложение
      </button>
    </div>
  </div>

  <!-- Экран чата -->
  <div class="chat-screen" id="chat-screen">
    <header>
      <button onclick="closeChat()" style="background:none; border:none; color:var(--button-color); font-size:16px; cursor:pointer;">← Назад</button>
      <h1 id="active-chat-title">Чат</h1>
      <div style="width: 50px;"></div>
    </header>
    <div class="messages" id="messages-list">
      <div class="message in">Привет! Напиши мне что-нибудь.</div>
    </div>
    <div class="input-area">
      <input type="text" id="msg-input" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Отправить</button>
    </div>
  </div>

  <!-- Нижние кнопки -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('chats', this)">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
      Чаты
    </button>
    <button class="nav-btn" onclick="switchTab('contacts', this)">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Контакты
    </button>
    <button class="nav-btn" onclick="switchTab('profile', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      Профиль
    </button>
  </nav>

  <script>
    // Инициализация Telegram Mini App
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Берем имя пользователя
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
    }

    // Логика переключения вкладок
    function switchTab(tabName, btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.getElementById('tab-chats').style.display = 'none';
      document.getElementById('tab-contacts').classList.remove('active');
      document.getElementById('tab-profile').classList.remove('active');

      const searchBar = document.getElementById('search-bar');
      const pageTitle = document.getElementById('page-title');

      if (tabName === 'chats') {
        document.getElementById('tab-chats').style.display = 'flex';
        searchBar.style.display = 'block';
        pageTitle.innerText = 'Чаты';
      } else if (tabName === 'contacts') {
        document.getElementById('tab-contacts').classList.add('active');
        searchBar.style.display = 'none';
        pageTitle.innerText = 'Контакты';
      } else if (tabName === 'profile') {
        document.getElementById('tab-profile').classList.add('active');
        searchBar.style.display = 'none';
        pageTitle.innerText = 'Профиль';
      }
    }

    function openChat(title, avatar) {
      document.getElementById('active-chat-title').innerText = title;
      document.getElementById('chat-screen').style.display = 'flex';
    }

    function closeChat() {
      document.getElementById('chat-screen').style.display = 'none';
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      const list = document.getElementById('messages-list');
      const msg = document.createElement('div');
      msg.className = 'message out';
      msg.innerText = text;
      list.appendChild(msg);

      input.value = '';
      list.scrollTop = list.scrollHeight;
    }
  </script>
</body>
</html>
